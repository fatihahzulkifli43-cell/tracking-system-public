<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Money Tracker</title>
<style>
  /* ============================================================
     DESIGN SYSTEM — warm cream, coral accent, charcoal ink
     Colours: every text/background pair below meets WCAG AA (≥4.5:1).
     Radii: cards 18px, controls 12–14px. Spacing: 4/8/12/16 scale.
     ============================================================ */
  :root{
    --outside:#ece6de;                 /* desktop area around the app column */
    --bg:#fdf8f3; --surface:#ffffff; --surface-2:#f7f2ec;
    --ink:#24302e; --ink-soft:#63706b; --ink-faint:#a3aca8; --line:#f1ebe4;
    --accent:#c84b38; --accent-ink:#b84432; --accent-soft:#fde9e3; --accent-line:#f6d3c9;
    --pos:#157a50; --neg:#c4473a;
    --lavender:#ece8fb; --lavender-ink:#5a49b8; --lavender-strong:var(--accent);
    --sky:#e3effb;      --sky-ink:#2a68ad;
    --mint:#dff4e9;     --mint-ink:#157a50;
    --peach:#fde9dc;    --peach-ink:#a8481f;
    --yellow:#fdf3cf;   --yellow-ink:#7d6200;
    --rose:#fde4ea;     --rose-ink:#b83a5a;
    --grey:#f1eeea;     --grey-ink:#5e6a66;
    /* aliases kept for existing markup */
    --card:var(--surface); --card-muted:var(--surface-2); --text-main:var(--ink); --text-soft:var(--ink-soft);
    --green:var(--pos); --red:var(--neg); --blue:var(--sky-ink);
    --radius-xl:22px; --radius-lg:18px; --radius-md:14px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(36,48,46,.04), 0 4px 14px rgba(36,48,46,.05);
    --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --nav-h:66px;
    --app-w:480px;                     /* portrait app column */
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overflow-x:hidden; }
  body{ font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
        padding-bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom)); }
  button,input,select,textarea{ font-family:var(--font); color:inherit; }
  button{ cursor:pointer; }
  svg.i{ fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; display:block; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---------- tones (icon badges, cards) ---------- */
  .t-lavender{ background:var(--lavender); color:var(--lavender-ink); }
  .t-sky{ background:var(--sky); color:var(--sky-ink); }
  .t-mint{ background:var(--mint); color:var(--mint-ink); }
  .t-peach{ background:var(--peach); color:var(--peach-ink); }
  .t-yellow{ background:var(--yellow); color:var(--yellow-ink); }
  .t-rose{ background:var(--rose); color:var(--rose-ink); }
  .t-grey{ background:var(--grey); color:var(--grey-ink); }
  .ibadge{ width:40px; height:40px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 40px; }
  .ibadge.sm{ width:32px; height:32px; flex-basis:32px; border-radius:10px; }
  .ibadge.sm svg{ width:17px; height:17px; }

  /* ---------- Header ---------- */
  .topbar{ position:sticky; top:0; z-index:20; background:rgba(245,244,251,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
           padding-top:env(safe-area-inset-top); }
  .topbar-inner{ max-width:620px; margin:0 auto; padding:12px 16px 8px; display:flex; align-items:center; gap:10px; }
  .brand-wrap{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px; }
  .logo{ width:36px; height:36px; border-radius:12px; background:var(--lavender-strong); color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .brand{ font-size:16px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15; }
  .brand small{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .month-nav{ flex:0 0 auto; display:flex; align-items:center; background:var(--surface); border-radius:999px; padding:3px; box-shadow:var(--shadow); }
  .month-nav button{ width:32px; height:32px; border:none; border-radius:999px; background:transparent; color:var(--ink); font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .month-nav button:active{ background:var(--surface-2); }
  .month-label{ width:auto !important; padding:0 6px !important; min-width:76px; white-space:nowrap; font-size:13.5px !important; font-weight:800 !important; }
  .month-label.is-current{ color:var(--accent-ink) !important; }

  .app{ max-width:620px; margin:0 auto; padding:8px 16px 8px; }
  .view{ display:none; }
  .view.active{ display:block; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:.4; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  .page-title{ font-size:22px; font-weight:800; letter-spacing:-.02em; margin:6px 2px 14px; }

  /* ---------- Hero: Available to spend ---------- */
  .hero{ position:relative; overflow:hidden; background:var(--lavender-strong); color:#fff; border-radius:var(--radius-xl); padding:20px 20px 16px; margin-bottom:12px;
         box-shadow:0 10px 24px rgba(122,106,240,.28); }
  .hero::before,.hero::after{ content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.12); pointer-events:none; }
  .hero::before{ width:180px; height:180px; right:-50px; top:-70px; }
  .hero::after{ width:110px; height:110px; right:40px; bottom:-60px; background:rgba(255,255,255,.08); }
  .hero-label{ font-size:13px; font-weight:700; opacity:.9; display:flex; align-items:center; gap:6px; position:relative; }
  .hero-value{ font-size:36px; font-weight:800; letter-spacing:-.03em; margin:4px 0 2px; position:relative; }
  .hero-value.neg{ color:#ffe0e6; }
  .hero-note{ font-size:12.5px; opacity:.85; position:relative; line-height:1.4; }
  .hero-split{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; position:relative; }
  .hero-split > div{ background:rgba(255,255,255,.16); border-radius:14px; padding:9px 12px; min-width:0; }
  .hero-split span{ display:block; font-size:11.5px; font-weight:700; opacity:.85; }
  .hero-split b{ display:block; font-size:16px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- Compact stat cards ---------- */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat{ border-radius:var(--radius-lg); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .stat .top{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; }
  .stat .top .ibadge{ background:rgba(255,255,255,.7); }
  .stat .val{ font-size:19px; font-weight:800; letter-spacing:-.02em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat small{ font-size:11.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- Cards / sections ---------- */
  .card{ background:var(--surface); color:var(--ink); border-radius:var(--radius-lg); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card h2,.sec-head{ font-size:15px; font-weight:800; color:var(--ink); margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; letter-spacing:-.01em; }
  .card h2 .link,.sec-head .link{ font-size:13px; color:var(--accent-ink); background:none; border:none; font-weight:700; padding:2px 0; }
  .sec-sub{ font-size:12.5px; color:var(--ink-soft); font-weight:600; margin:-6px 0 10px; }
  details.fold{ background:var(--surface); border-radius:var(--radius-lg); margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden; }
  details.fold > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; user-select:none; }
  details.fold > summary::-webkit-details-marker{ display:none; }
  details.fold > summary .sum-title{ flex:1 1 auto; font-size:15px; font-weight:800; }
  details.fold > summary .sum-meta{ font-size:13.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap; }
  details.fold > summary .chev{ color:var(--ink-faint); transition:transform .2s ease; }
  details.fold[open] > summary .chev{ transform:rotate(90deg); }
  details.fold .fold-body{ padding:0 16px 14px; }

  .row-line{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; gap:10px; }
  .row-line .label{ font-size:14px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:8px; min-width:0; }
  .row-line .value{ font-size:14.5px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .row-line.total{ border-top:1px solid var(--line); margin-top:4px; padding-top:11px; }
  .row-line.total .label{ color:var(--ink); }
  .progress{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:2px 0 10px; }
  .progress span{ display:block; height:100%; background:var(--mint-ink); border-radius:999px; transition:width .25s ease; }
  .muted{ color:var(--ink-soft); font-size:13px; line-height:1.5; }
  .pos{ color:var(--pos) !important; } .neg{ color:var(--neg) !important; }

  /* ---------- Lists ---------- */
  .list-item{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child{ border-bottom:none; }
  .li-main{ flex:1 1 auto; min-width:0; background:none; border:none; padding:0; text-align:left; display:flex; align-items:center; gap:12px; color:inherit; }
  .li-text{ flex:1 1 auto; min-width:0; }
  .li-title{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
  .li-title .rcpt-dot,.li-title .link-dot{ color:var(--ink-faint); display:inline-flex; }
  .li-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-meta{ display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .li-amt{ flex:0 0 auto; text-align:right; font-size:14.5px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .li-amt small{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:2px; }
  .icon-btn{ flex:0 0 auto; width:28px; height:28px; border-radius:999px; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover,.icon-btn:active{ background:var(--rose); color:var(--rose-ink); }
  .date-head{ font-size:12px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; padding:12px 0 2px; }
  .date-head:first-child{ padding-top:0; }

  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .chip svg{ width:12px; height:12px; stroke-width:2.4; }
  .chip.paid{ background:var(--mint); color:var(--mint-ink); }
  .chip.partial{ background:var(--yellow); color:var(--yellow-ink); }
  .chip.pending{ background:var(--sky); color:var(--sky-ink); }
  .chip.overdue{ background:var(--rose); color:var(--rose-ink); }
  .chip.over{ background:var(--lavender); color:var(--lavender-ink); }
  .chip.soft{ background:var(--surface-2); color:var(--ink-soft); }

  .filters{ display:flex; gap:6px; overflow-x:auto; padding:0 2px 12px; scrollbar-width:none; }
  .filters::-webkit-scrollbar{ display:none; }
  .filter{ flex:0 0 auto; border:none; background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:700; padding:8px 13px; border-radius:999px; box-shadow:var(--shadow); }
  .filter.active{ background:var(--ink); color:#fff; }

  .add-btn{ width:100%; padding:11px; border-radius:var(--radius-md); border:1.5px dashed #e6d9cd; background:transparent; color:var(--accent-ink); font-size:14px; font-weight:800; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .add-btn svg{ width:18px; height:18px; }
  .add-btn:active{ background:var(--accent-soft); }
  .btn{ border:none; border-radius:var(--radius-md); padding:12px 14px; font-size:14px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn svg{ width:18px; height:18px; }
  .btn:active{ transform:scale(.98); }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.secondary{ background:var(--surface-2); color:var(--ink); }
  .btn.danger{ background:var(--neg); color:#fff; }
  .btn.ghost-danger{ background:var(--rose); color:var(--rose-ink); }
  .btn.small{ padding:7px 12px; font-size:12.5px; border-radius:999px; }
  .btn.pay{ background:var(--mint); color:var(--mint-ink); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1 1 auto; }

  .empty{ text-align:center; padding:20px 10px; color:var(--ink-soft); font-size:13.5px; line-height:1.55; }
  .empty .big{ width:56px; height:56px; border-radius:18px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; }
  .empty .big svg{ width:28px; height:28px; }
  .empty b{ color:var(--ink); font-size:16px; }
  .empty .btn{ margin-top:10px; }

  /* ---------- Bottom navigation + add button ---------- */
  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
               box-shadow:0 -4px 20px rgba(29,35,80,.06); padding-bottom:env(safe-area-inset-bottom); }
  .bottom-nav-inner{ max-width:620px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); height:var(--nav-h); }
  .nav-btn{ border:none; background:none; color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11px; font-weight:700; }
  .nav-btn .nav-ic{ width:44px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; transition:background .15s ease; }
  .nav-btn svg{ width:21px; height:21px; }
  .nav-btn.active{ color:var(--accent-ink); }
  .nav-btn.active .nav-ic{ background:var(--accent-soft); }
  .fab{ position:fixed; z-index:31; right:max(16px, calc(50vw - 294px)); bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
        width:54px; height:54px; border-radius:18px; border:none; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
        box-shadow:0 10px 22px rgba(29,35,80,.28); }
  .fab svg{ width:26px; height:26px; stroke-width:2.2; }
  .fab:active{ transform:scale(.95); }

  /* ---------- Sheets (bottom modal) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(29,35,80,.35); display:none; align-items:flex-end; justify-content:center; z-index:100; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--surface); color:var(--ink); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:26px 26px 0 0;
          padding:10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px rgba(29,35,80,.18); animation:slideUp .2s ease; }
  .sheet::before{ content:""; display:block; width:40px; height:4px; border-radius:4px; background:#dcdbe9; margin:0 auto 12px; }
  @media (min-width:700px){ .overlay{ align-items:center; } .sheet{ border-radius:26px; } .sheet::before{ display:none; } }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:.6; } to{ transform:none; opacity:1; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .sheet-head h3{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .sheet-close{ width:32px; height:32px; border-radius:999px; border:none; background:var(--surface-2); color:var(--ink-soft); font-size:14px; font-weight:800; }
  .sheet p.msg{ margin:0 0 16px; font-size:14px; color:var(--ink-soft); line-height:1.5; white-space:pre-line; }
  .sheet h4{ color:var(--ink-faint) !important; }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:10px; min-width:0; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 5px 2px; }
  .field input,.field select,.field textarea{ width:100%; border:1.5px solid transparent; background:var(--surface-2); border-radius:var(--radius-sm);
           padding:11px 12px; font-size:16px; font-weight:600; color:var(--ink); outline:none; -webkit-appearance:none; appearance:none; min-height:46px; }
  .field select{ background-image:linear-gradient(45deg,transparent 50%,#8f9a96 50%),linear-gradient(135deg,#8f9a96 50%,transparent 50%);
           background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%; background-size:5px 5px; background-repeat:no-repeat; padding-right:28px; }
  .field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--lavender-strong); background:#fff; }
  .field.invalid input,.field.invalid select{ border-color:var(--rose-ink); background:#fff7f8; }
  .field .err{ display:none; font-size:12px; color:var(--rose-ink); font-weight:700; margin:4px 0 0 2px; }
  .field.invalid .err{ display:block; }
  .field .hint{ font-size:12px; color:var(--ink-soft); margin:4px 0 0 2px; line-height:1.4; }
  .frow{ display:flex; gap:8px; }
  .frow > .field{ flex:1 1 0; }
  .frow > .field.amt{ flex:0 0 44%; }
  .amount-input{ position:relative; }
  .amount-input span{ position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; font-weight:800; color:var(--ink-faint); pointer-events:none; }
  .amount-input input{ padding-left:38px !important; font-weight:800 !important; }
  .type-income select{ color:var(--mint-ink); } .type-expense select{ color:var(--peach-ink); } .type-transfer select{ color:var(--accent-ink); }
  .type-deposit select{ color:var(--sky-ink); } .type-withdrawal select{ color:var(--yellow-ink); }
  @media (max-width:340px){ .frow.wrap-xs{ flex-wrap:wrap; } .frow.wrap-xs > .field{ flex:1 1 100%; } }

  .receipt-area{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:var(--radius-sm); padding:7px 8px 7px 10px; margin-bottom:12px; min-height:48px; flex-wrap:wrap; }
  .receipt-area .thumb{ width:38px; height:38px; border-radius:9px; object-fit:cover; background:#e2e0ef; flex:0 0 auto; cursor:pointer; }
  .receipt-area .r-text{ flex:1 1 auto; font-size:13px; font-weight:700; color:var(--ink-soft); min-width:0; }
  .pick{ position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:6px; border:none; background:#fff; color:var(--ink);
         border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:800; white-space:nowrap; box-shadow:var(--shadow); }
  .pick svg{ width:16px; height:16px; }
  .pick input{ position:absolute; inset:0; opacity:0; font-size:16px; cursor:pointer; }
  .link-btn{ border:none; background:none; color:var(--accent-ink); font-size:12.5px; font-weight:800; padding:6px 4px; }
  .link-btn.red{ color:var(--rose-ink); }
  .sheet-actions{ display:flex; gap:8px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }
  .sheet-actions .btn.del{ flex:0 0 auto; background:var(--rose); color:var(--rose-ink); }
  .row-line input[type=checkbox]{ accent-color:var(--lavender-strong); }

  .toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0;
          background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:700;
          z-index:200; transition:all .2s ease; pointer-events:none; max-width:90vw; text-align:center; box-shadow:0 8px 20px rgba(29,35,80,.25); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ background:var(--rose-ink); }

  .pay-list{ margin:6px 0 12px; }
  .warn{ background:var(--yellow); color:#7a5a00; border-radius:var(--radius-md); padding:10px 12px; font-size:13px; font-weight:600; line-height:1.45; margin-bottom:12px; display:flex; gap:8px; align-items:flex-start; }
  .warn svg{ width:18px; height:18px; margin-top:1px; }
  .info{ background:var(--sky); color:#1f4f85; border-radius:var(--radius-md); padding:10px 12px; font-size:13px; font-weight:600; line-height:1.45; margin-bottom:12px; }
  .more-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .more-row:last-child{ border-bottom:none; }
  .more-row .txt{ flex:1 1 auto; min-width:0; font-size:14.5px; font-weight:700; }
  .more-row .txt small{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:2px; }
  footer.foot{ text-align:center; font-size:12px; color:var(--ink-faint); padding:4px 20px 0; line-height:1.6; }


  /* ---------- Bill checkbox rows ---------- */
  .bill-item{ gap:6px; }
  .bill-check{ flex:0 0 auto; width:40px; height:44px; margin-left:-8px; border:none; background:none; padding:0; display:flex; align-items:center; justify-content:center; }
  .bill-check .box{ width:24px; height:24px; border-radius:8px; border:2px solid #c9c6e0; background:#fff; display:flex; align-items:center; justify-content:center; color:transparent; transition:all .15s ease; }

  .profile-card.flat{ box-shadow:none; padding:0; margin:0 0 6px; }

  .prof-row .txt{ flex:1 1 auto; min-width:0; font-size:15px; font-weight:800; }
  .prof-row .txt small{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); }

  /* ================= v4: portrait column, warm components ================= */
  html,body{ background:var(--outside); }

                background:var(--bg); z-index:-1; box-shadow:0 0 50px rgba(36,48,46,.07); }

  .page-title{ font-size:22px; }

  /* hero: the strongest element on Dashboard and Accounts */

  .sec-sub{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  .amt-hero .amount-input span{ font-size:18px; left:16px; color:var(--ink-soft); }
  .field input:focus,.field select:focus,.field textarea:focus{ box-shadow:0 0 0 3px var(--accent-soft); }
  .sheet-actions{ position:sticky; bottom:calc(-18px - env(safe-area-inset-bottom)); background:var(--surface); padding:10px 0 calc(4px + env(safe-area-inset-bottom)); margin-top:8px; z-index:2; }

<script>
/* =====================================================================
   MONEY TRACKER — public frontend prototype
   Modules (all in this file, each replaceable later):
     Util      – formatting, dates, ids, escaping
     Store     – persistence (localStorage now; swap for a Supabase
                 repository later — the rest of the app only calls Store)
     Ledger    – pure calculation logic (balances, bill status, summaries)
     Receipts  – receipt images in IndexedDB (later: private storage bucket)
     Xlsx      – .xlsx writer used by Export
     UI        – views, sheets/forms, navigation
   DATA MODEL (single source of truth = transactions):
     account     { id, name, type, openingBalance, includeInAvailable, archived, createdAt }
     transaction { id, type: income|expense|transfer|deposit|withdrawal, amount (>0),
                   date YYYY-MM-DD, accountId, toAccountId (transfer only),
                   description, category, billId (expense only, optional),
                   receiptId, note, createdAt, updatedAt }
     bill        { id, name, amount (planned), dueDate, category, accountId,
                   receiptId, note, createdAt }   ← a planned expense
   A bill never changes a balance. Paying a bill = an "expense" transaction
   with billId. Bill status (pending/partial/paid) is derived from those
   transactions, so a payment is counted exactly once, and editing or
   deleting it updates both the balance and the bill status.
   ===================================================================== */
(function(){
  "use strict";

  /* ============================== Util ============================== */
  var Util = {
    uid: function(prefix){
      var r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      return (prefix || "") + r;
    },
    pad: function(n){ return (n < 10 ? "0" : "") + n; },
    todayISO: function(){ var d = new Date(); return d.getFullYear() + "-" + Util.pad(d.getMonth() + 1) + "-" + Util.pad(d.getDate()); },
    monthOf: function(iso){ return String(iso || "").slice(0, 7); },
    currentMonth: function(){ return Util.todayISO().slice(0, 7); },
    addMonths: function(key, n){
      var y = +key.slice(0, 4), m = +key.slice(5, 7) - 1 + n;
      y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
      return y + "-" + Util.pad(m + 1);
    },
    endOfMonth: function(key){
      var y = +key.slice(0, 4), m = +key.slice(5, 7);
      return key + "-" + Util.pad(new Date(y, m, 0).getDate());
    },
    MONTHS: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    monthLabel: function(key, short){
      var n = Util.MONTHS[+key.slice(5, 7) - 1];
      return (short ? n.slice(0, 3) : n) + " " + key.slice(0, 4);
    },
    isISODate: function(s){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false;
      var y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);
      var dt = new Date(y, m - 1, d); // local date, no timezone shift
      return y >= 1900 && y <= 2200 && dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    },
    fmtDate: function(iso){
      if(!Util.isISODate(iso)) return "";
      var d = new Date(iso + "T00:00:00");
      return d.getDate() + " " + Util.MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
    },
    r2: function(n){ return Math.round((+n || 0) * 100) / 100; },
    money: function(n, signed){
      n = Util.r2(n);
      var s = Math.abs(n).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var sign = n < 0 ? "-" : (signed && n > 0 ? "+" : "");
      return sign + "RM" + s;
    },
    esc: function(s){
      return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    },
    // amount parser: positive, max 2 decimals, max 1 billion
    parseAmount: function(v){
      var s = String(v == null ? "" : v).trim().replace(/,/g, "");
      if(!/^\d+(\.\d{1,2})?$/.test(s)) return null;
      var n = Number(s);
      return (n > 0 && n < 1e9) ? Util.r2(n) : null;
    },
    safeAvatar: function(v){ return (typeof v === "string" && v.length < 200000 && /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/.test(v)) ? v : null; },
    parseSignedAmount: function(v){
      var s = String(v == null ? "" : v).trim().replace(/,/g, "");
      if(s === "") return 0;
      if(!/^-?\d+(\.\d{1,2})?$/.test(s)) return null;
      var n = Number(s);
      return Math.abs(n) < 1e9 ? Util.r2(n) : null;
    }
  };

  var ACCOUNT_TYPES = [
    { v: "bank", t: "Bank account", icon: "🏦", available: true },
    { v: "ewallet", t: "E-wallet", icon: "📱", available: true },
    { v: "cash", t: "Cash", icon: "💵", available: true },
    { v: "savings", t: "Savings", icon: "🐷", available: false },
    { v: "investment", t: "Investment", icon: "📈", available: false },
    { v: "credit", t: "Credit card", icon: "💳", available: true },
    { v: "other", t: "Other", icon: "👛", available: true }
  ];
  var EXPENSE_CATEGORIES = ["Housing", "Utilities", "Food & Groceries", "Transport", "Phone & Internet", "Insurance", "Loan & Debt", "Shopping", "Health", "Education", "Family", "Entertainment", "Subscriptions", "Others"];
  var INCOME_CATEGORIES = ["Salary", "Business", "Freelance", "Bonus", "Gift", "Refund", "Others"];
  var TX_TYPES = {
    income:     { t: "Income",     icon: "↓", sign: +1, cls: "ic-income" },
    expense:    { t: "Expense",    icon: "↑", sign: -1, cls: "ic-expense" },
    transfer:   { t: "Transfer",   icon: "⇄", sign: 0,  cls: "ic-transfer" },
    deposit:    { t: "Deposit",    icon: "+", sign: +1, cls: "ic-deposit" },
    withdrawal: { t: "Withdrawal", icon: "−", sign: -1, cls: "ic-withdrawal" }
  };
  function accountType(v){ return ACCOUNT_TYPES.find(function(a){ return a.v === v; }) || ACCOUNT_TYPES[ACCOUNT_TYPES.length - 1]; }

  /* ============================== Store ==============================
     All reads/writes go through here. To move to Supabase later, keep
     these method names and replace the bodies with API calls (async).  */
  var Store = (function(){
    var LEGACY_KEY = "moneyTracker_public_v1"; // pre-profile data: read for migration, never deleted
    var KEY = null;                            // active profile's key: LEGACY_KEY + "__p_" + profileId
    var OWNER = null;                          // active profile id; stamped on every record as ownerId
    function keyFor(id){ return LEGACY_KEY + "__p_" + id; }
    var VERSION = 1;
    var data = null;
    var listeners = [];

    function blank(){ return { version: VERSION, accounts: [], transactions: [], bills: [], settings: {} }; }

    // owner: profile id the records must belong to. Records tagged with a
    // DIFFERENT owner are dropped (never mixed in); untagged records are stamped.
    function sanitize(d, owner){
      var out = blank();
      if(!d || typeof d !== "object") return out;
      function foreign(x){ return owner && typeof x.ownerId === "string" && x.ownerId && x.ownerId !== owner; }
      function ownerOf(x){ return owner || (typeof x.ownerId === "string" ? x.ownerId : null); }
      out.ownerId = owner || null;
      (Array.isArray(d.accounts) ? d.accounts : []).forEach(function(a){
        if(!a || typeof a.id !== "string" || typeof a.name !== "string" || foreign(a)) return;
        out.accounts.push({ ownerId: ownerOf(a),
          id: a.id, name: a.name.slice(0, 60), type: accountType(a.type).v,
          openingBalance: Util.r2(a.openingBalance), includeInAvailable: a.includeInAvailable !== false,
          archived: !!a.archived, createdAt: a.createdAt || new Date().toISOString()
        });
      });
      var ids = {}; out.accounts.forEach(function(a){ ids[a.id] = true; });
      (Array.isArray(d.bills) ? d.bills : []).forEach(function(b){
        if(!b || typeof b.id !== "string" || !Util.isISODate(b.dueDate) || foreign(b)) return;
        out.bills.push({ ownerId: ownerOf(b),
          id: b.id, name: String(b.name || "").slice(0, 80), amount: Util.r2(b.amount), dueDate: b.dueDate,
          category: String(b.category || "Others"), accountId: ids[b.accountId] ? b.accountId : null,
          receiptId: typeof b.receiptId === "string" ? b.receiptId : null, note: String(b.note || ""), createdAt: b.createdAt || new Date().toISOString()
        });
      });
      var billIds = {}; out.bills.forEach(function(b){ billIds[b.id] = true; });
      (Array.isArray(d.transactions) ? d.transactions : []).forEach(function(t){
        if(!t || typeof t.id !== "string" || !TX_TYPES[t.type] || !Util.isISODate(t.date) || !ids[t.accountId] || foreign(t)) return;
        if(t.type === "transfer" && (!ids[t.toAccountId] || t.toAccountId === t.accountId)) return;
        var amt = Util.r2(t.amount); if(!(amt > 0)) return;
        out.transactions.push({ ownerId: ownerOf(t),
          id: t.id, type: t.type, amount: amt, date: t.date, accountId: t.accountId,
          toAccountId: t.type === "transfer" ? t.toAccountId : null,
          description: String(t.description || "").slice(0, 80), category: String(t.category || ""),
          billId: (t.type === "expense" && billIds[t.billId]) ? t.billId : null,
          receiptId: typeof t.receiptId === "string" ? t.receiptId : null, note: String(t.note || ""),
          createdAt: t.createdAt || new Date().toISOString(), updatedAt: t.updatedAt || null
        });
      });
      out.settings = (d.settings && typeof d.settings === "object") ? d.settings : {};
      return out;
    }

    function load(){
      var raw = null;
      try{ raw = localStorage.getItem(KEY); }catch(e){ data = blank(); return { ok: false, error: "Browser storage is not available. Changes won't be saved." }; }
      if(!raw){ data = blank(); return { ok: true }; }
      try{ data = sanitize(JSON.parse(raw), OWNER); return { ok: true }; }
      catch(e){
        try{ localStorage.setItem(KEY + "_unreadable_" + Date.now(), raw); }catch(_){}

      if(!KEY || !OWNER){ UI.toast("Sign in first.", true); throw new Error("Not signed in"); }

      catch(e){ UI.toast("Could not save — browser storage is full or blocked.", true); throw e; }

      LEGACY_KEY: LEGACY_KEY, keyFor: keyFor, activeKey: function(){ return KEY; },
      // point the store at one profile's data (null = no profile)
      useProfile: function(id){ KEY = id ? keyFor(id) : null; OWNER = id || null; if(!KEY){ data = blank(); return { ok: true }; } return load(); },
      writeFor: function(id, d){ localStorage.setItem(keyFor(id), JSON.stringify(sanitize(d, id))); },
      owner: function(){ return OWNER; },
      dropProfile: function(id){ try{ localStorage.removeItem(keyFor(id)); }catch(e){} if(KEY === keyFor(id)) data = blank(); },

          return { data: d,
            profile: (prof && typeof prof.name === "string" && prof.name.trim()) ? { name: prof.name.trim().slice(0, 40), avatar: Util.safeAvatar(prof.avatar) } : null,

      snapshot: function(){ return JSON.parse(JSON.stringify(data)); },
      replaceAll: function(d){ data = sanitize(d, OWNER); persist(); },
      clear: function(){ data = blank(); persist(); },
      settings: function(){ return data.settings; },
      setSetting: function(k, v){ data.settings[k] = v; persist(); },

      accounts: {
        list: function(includeArchived){ return data.accounts.filter(function(a){ return includeArchived || !a.archived; }); },
        get: function(id){ return find("accounts", id); },
        save: function(a){ return upsert("accounts", a); },
        usage: function(id){
          return {
            tx: data.transactions.filter(function(t){ return t.accountId === id || t.toAccountId === id; }).length,
            bills: data.bills.filter(function(b){ return b.accountId === id; }).length
          };
        },
        remove: function(id){
          var u = this.usage(id);
          if(u.tx > 0) throw new Error("This account has " + u.tx + " transaction(s). Archive it instead, or delete those transactions first.");
          data.bills.forEach(function(b){ if(b.accountId === id) b.accountId = null; });
          removeWhere("accounts", function(a){ return a.id === id; });
          persist();
        }
      },

      transactions: {
        list: function(){ return data.transactions.slice(); },
        get: function(id){ return find("transactions", id); },
        save: function(t){ t.updatedAt = new Date().toISOString(); return upsert("transactions", t); },
        remove: function(id){ var r = removeWhere("transactions", function(t){ return t.id === id; }); persist(); return r[0] || null; },
        forBill: function(billId){ return data.transactions.filter(function(t){ return t.billId === billId; }); }
      },

      bills: {
        list: function(){ return data.bills.slice(); },
        get: function(id){ return find("bills", id); },
        save: function(b){ return upsert("bills", b); },
        // keepPayments: payments stay as normal expenses (money really left the account)
        remove: function(id, keepPayments){
          var removedTx = [];
          if(keepPayments){
            data.transactions.forEach(function(t){ if(t.billId === id) t.billId = null; });
          } else {
            removedTx = removeWhere("transactions", function(t){ return t.billId === id; });
          }
          var b = removeWhere("bills", function(x){ return x.id === id; })[0] || null;
          persist();
          return { bill: b, removedTx: removedTx };
        }
      }
    };
  })();

  /* ============================== Profiles ==============================
     Local profiles ONLY (no login, no passwords, no security).
     Registry key  : moneyTracker_public_profiles
                     { version, activeId, legacyMigratedTo, profiles:[{id,name,avatar,createdAt,updatedAt}] }
     Data per profile : localStorage "moneyTracker_public_v1__p_<id>"   (Store)
     Receipts per profile : IndexedDB "moneyTracker_public_receipts__p_<id>" (Receipts)
     The original "moneyTracker_public_v1" data is never deleted; it can be
     copied into the first profile.                                         */
  var Profiles = (function(){
    var KEY = "moneyTracker_public_profiles";
    var reg = null;
    function blank(){ return { version: 1, activeId: null, legacyMigratedTo: null, profiles: [] }; }
    function clean(p){
      return { id: p.id, name: String(p.name).trim().slice(0, 40), avatar: Util.safeAvatar(p.avatar),
               createdAt: p.createdAt || new Date().toISOString(), updatedAt: p.updatedAt || null };
    }
    function save(){
      try{ localStorage.setItem(KEY, JSON.stringify(reg)); }
      catch(e){ UI.toast("Could not save profile — browser storage is full or blocked.", true); throw e; }
    }
    function find(id){ return reg.profiles.find(function(p){ return p.id === id; }) || null; }
    return {
      KEY: KEY,
      load: function(){
        try{ var raw = localStorage.getItem(KEY); reg = raw ? JSON.parse(raw) : blank(); }catch(e){ reg = blank(); }
        if(!reg || !Array.isArray(reg.profiles)) reg = blank();
        reg.profiles = reg.profiles.filter(function(p){
          return p && typeof p.id === "string" && /^[A-Za-z0-9_-]{4,64}$/.test(p.id) && typeof p.name === "string" && p.name.trim();
        }).map(clean);
        if(!find(reg.activeId)) reg.activeId = null;   // never auto-sign-in to someone else
      },
      list: function(){ return reg.profiles.slice(); },
      get: find,
      active: function(){ return find(reg.activeId); },
      nameTaken: function(name, exceptId){
        var n = name.trim().toLowerCase();
        return reg.profiles.some(function(p){ return p.id !== exceptId && p.name.toLowerCase() === n; });
      },
      create: function(name, avatar){
        var p = clean({ id: "p_" + Util.uid("").replace(/[^A-Za-z0-9]/g, "").slice(0, 24), name: name, avatar: avatar });
        reg.profiles.push(p); save(); return p;
      },
      update: function(id, fields){
        var p = find(id); if(!p) return null;
        if(fields.name !== undefined) p.name = String(fields.name).trim().slice(0, 40);
        if(fields.avatar !== undefined) p.avatar = Util.safeAvatar(fields.avatar);
        p.updatedAt = new Date().toISOString(); save(); return p;
      },
      setActive: function(id){ if(find(id)){ reg.activeId = id; save(); } },
      signOut: function(){ reg.activeId = null; save(); },
      findByName: function(name){ var n = String(name).trim().toLowerCase(); return reg.profiles.find(function(p){ return p.name.toLowerCase() === n; }) || null; },
      remove: function(id){
        reg.profiles = reg.profiles.filter(function(p){ return p.id !== id; });
        if(reg.activeId === id) reg.activeId = null;
        save();
      },
      legacyMigratedTo: function(){ return reg.legacyMigratedTo || null; },
      markLegacyMigrated: function(id){ reg.legacyMigratedTo = id; save(); }
    };
  })();

  /* ============================== Ledger ==============================
     Pure functions. Balances come ONLY from opening balance + transactions. */
  var Ledger = {
    // effect of one transaction on account balances
    effects: function(t){
      var a = Util.r2(t.amount);
      switch(t.type){
        case "income": case "deposit": return [{ accountId: t.accountId, delta: a }];
        case "expense": case "withdrawal": return [{ accountId: t.accountId, delta: -a }];
        case "transfer": return [{ accountId: t.accountId, delta: -a }, { accountId: t.toAccountId, delta: a }];
      }
      return [];
    },
    balance: function(accountId, upToDate){
      var acc = Store.accounts.get(accountId);
      if(!acc) return 0;
      var bal = acc.openingBalance;
      Store.transactions.list().forEach(function(t){
        if(upToDate && t.date > upToDate) return;
        Ledger.effects(t).forEach(function(e){ if(e.accountId === accountId) bal += e.delta; });
      });
      return Util.r2(bal);
    },
    billStatus: function(bill, today){
      today = today || Util.todayISO();
      var pays = Store.transactions.forBill(bill.id);
      var paid = Util.r2(pays.reduce(function(s, t){ return s + t.amount; }, 0));
      var remaining = Util.r2(Math.max(bill.amount - paid, 0));
      var over = Util.r2(Math.max(paid - bill.amount, 0));
      var status = paid <= 0 ? "pending" : (remaining > 0 ? "partial" : "paid");
      return { paid: paid, remaining: remaining, over: over, status: status, payments: pays,
               overdue: remaining > 0 && bill.dueDate < today };
    },
    monthSummary: function(month){
      var end = Util.endOfMonth(month);
      var txs = Store.transactions.list().filter(function(t){ return Util.monthOf(t.date) === month; });
      var accounts = Store.accounts.list(true);
      var accById = {}; accounts.forEach(function(a){ accById[a.id] = a; });
      var s = { month: month, income: 0, expenses: 0, billPayments: 0, otherSpending: 0, deposits: 0, withdrawals: 0,
                transfers: 0, transferCount: 0, toSavings: 0, fromSavings: 0, txCount: txs.length };
      txs.forEach(function(t){
        if(t.type === "income") s.income += t.amount;
        else if(t.type === "expense"){ s.expenses += t.amount; if(t.billId) s.billPayments += t.amount; else s.otherSpending += t.amount; }
        else if(t.type === "deposit") s.deposits += t.amount;
        else if(t.type === "withdrawal") s.withdrawals += t.amount;
        else if(t.type === "transfer"){
          s.transfers += t.amount; s.transferCount++;
          var to = accById[t.toAccountId], from = accById[t.accountId];
          var toSave = to && !to.includeInAvailable, fromSave = from && !from.includeInAvailable;
          if(toSave && !fromSave) s.toSavings += t.amount;
          if(fromSave && !toSave) s.fromSavings += t.amount;
        }
      });
      var bills = Store.bills.list().filter(function(b){ return Util.monthOf(b.dueDate) === month; });
      s.planned = 0; s.plannedPaid = 0; s.pending = 0; s.overdueCount = 0; s.billCount = bills.length; s.billsPaidCount = 0;
      bills.forEach(function(b){
        var st = Ledger.billStatus(b);
        s.planned += b.amount; s.plannedPaid += Math.min(st.paid, b.amount); s.pending += st.remaining;
        if(st.overdue) s.overdueCount++;
        if(st.status === "paid") s.billsPaidCount++;
      });
      s.balances = accounts.map(function(a){ return { account: a, balance: Ledger.balance(a.id, end) }; })
        .filter(function(x){ return !x.account.archived || Math.abs(x.balance) >= 0.005; });
      s.totalBalance = s.balances.reduce(function(t, x){ return t + x.balance; }, 0);
      s.availableBalance = s.balances.reduce(function(t, x){ return t + (x.account.includeInAvailable ? x.balance : 0); }, 0);
      s.remainingAvailable = s.availableBalance - s.pending;
      s.netFlow = s.income - s.expenses;
      ["income","expenses","billPayments","otherSpending","deposits","withdrawals","transfers","toSavings","fromSavings","planned","plannedPaid","pending","totalBalance","availableBalance","remainingAvailable","netFlow"]
        .forEach(function(k){ s[k] = Util.r2(s[k]); });
      return s;
    }
  };

  /* ============================== Receipts ============================== */
  var Receipts = (function(){
    // One IndexedDB database per profile: BASE + "__p_" + profileId.
    // BASE itself holds receipts saved before profiles (copied, never deleted).
    var BASE = "moneyTracker_public_receipts", STORE = "receipts", p = null, ns = null, conn = null;
    function openDb(name){
      return new Promise(function(res, rej){
        if(!window.indexedDB){ rej(new Error("Receipt storage isn't supported in this browser.")); return; }
        var r = indexedDB.open(name, 1);
        r.onupgradeneeded = function(){ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE, { keyPath: "id" }); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error || new Error("Could not open receipt storage.")); };
      });
    }
    function open(){
      if(p) return p;
      if(!ns) return Promise.reject(new Error("Create or choose a profile first."));
      var mine = ns;
      p = openDb(BASE + "__p_" + mine).then(function(db){
        if(ns !== mine){ db.close(); throw new Error("Profile changed."); }
        conn = db;
        db.onversionchange = function(){ db.close(); if(conn === db){ conn = null; p = null; } };
        return db;
      });
      p.catch(function(){ p = null; });
      return p;
    }
    function tx(mode, fn){
      return open().then(function(db){
        return new Promise(function(res, rej){
          var t = db.transaction(STORE, mode), out;
          fn(t.objectStore(STORE), function(v){ out = v; });
          t.oncomplete = function(){ res(out); };
          t.onerror = t.onabort = function(){ rej(t.error || new Error("Receipt storage error.")); };
        });
      });
    }
    function readBuf(blob){
      return new Promise(function(res, rej){
        var fr = new FileReader();
        fr.onload = function(){ res(fr.result); };
        fr.onerror = function(){ rej(fr.error); };
        fr.readAsArrayBuffer(blob);
      });
    }
    // Resize big phone photos (max 1600px JPEG); keep original if it can't be decoded
    function compress(file){
      return new Promise(function(res){
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function(){
          try{
            var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
            var c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
            var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function(b){ URL.revokeObjectURL(url); res(b && b.size < file.size ? b : file); }, "image/jpeg", 0.82);
          }catch(e){ URL.revokeObjectURL(url); res(file); }
        };
        img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
        img.src = url;
      });
    }
    return {
      useNamespace: function(id){ if(conn){ conn.close(); conn = null; } p = null; ns = id || null; },
      deleteNamespace: function(id){
        if(id === ns && conn){ conn.close(); conn = null; p = null; }
        return new Promise(function(res){
          if(!window.indexedDB) return res();
          var r = indexedDB.deleteDatabase(BASE + "__p_" + id);
          r.onsuccess = r.onerror = r.onblocked = function(){ res(); };
        });
      },
      // copy pre-profile receipts into a profile (the source is left as it is)
      copyLegacyInto: function(id){
        return openDb(BASE).then(function(src){
          return new Promise(function(res, rej){
            var q = src.transaction(STORE).objectStore(STORE).getAll();
            q.onsuccess = function(){ src.close(); res(q.result || []); };
            q.onerror = function(){ src.close(); rej(q.error); };
          });
        }).then(function(recs){
          if(!recs.length) return 0;
          return openDb(BASE + "__p_" + id).then(function(dst){
            return new Promise(function(res, rej){
              var t = dst.transaction(STORE, "readwrite");
              recs.forEach(function(r){ r.ownerId = id; t.objectStore(STORE).put(r); });
              t.oncomplete = function(){ dst.close(); res(recs.length); };
              t.onerror = t.onabort = function(){ dst.close(); rej(t.error); };
            });
          });
        });
      },
      validate: function(file){
        if(!file) return "No file selected.";
        if(file.type && !/^image\//.test(file.type)) return "Please choose an image file (JPG, PNG, HEIC…).";
        if(file.size > 25 * 1024 * 1024) return "That image is larger than 25 MB.";
        return null;
      },
      save: function(file, id){
        id = id || Util.uid("rc_");
        return compress(file).then(function(blob){
          return readBuf(blob).then(function(buf){
            return tx("readwrite", function(s){ s.put({ id: id, ownerId: ns, type: blob.type || file.type || "image/jpeg", data: buf, size: buf.byteLength, savedAt: new Date().toISOString() }); });
          });
        }).then(function(){ return id; });
      },
      getUrl: function(id){
        return tx("readonly", function(s, done){ var r = s.get(id); r.onsuccess = function(){ done(r.result || null); }; })
          .then(function(rec){ return (rec && (!rec.ownerId || rec.ownerId === ns)) ? URL.createObjectURL(new Blob([rec.data], { type: rec.type })) : null; });
      },
      remove: function(id){ if(!id) return Promise.resolve(); return tx("readwrite", function(s){ s.delete(id); }); },
      clear: function(){ return tx("readwrite", function(s){ s.clear(); }); },
      ids: function(){ return tx("readonly", function(s, done){ var r = s.getAllKeys(); r.onsuccess = function(){ done(r.result || []); }; }); }
    };
  })();

  /* ============================== Xlsx ============================== */

      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +

      '<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
      '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>' +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

    // cell: null | string | number | { v: value, s: styleIndex }
    function sheetXml(sheet){

        '</Relationships>') });
      files.push({ name: "xl/workbook.xml", data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets>' + sheets.map(function(s, i){
          return '<sheet name="' + esc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
        }).join("") + '</sheets></workbook>') });
      files.push({ name: "xl/_rels/workbook.xml.rels", data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +

    /* ---------- Transactions ---------- */
    function renderTransactions(){
      var el = $("view-transactions");
      if(Store.accounts.list(true).length === 0){ el.innerHTML = emptyNoAccounts(); return; }
      var filters = [["all", "All"], ["income", "Income"], ["expense", "Expenses"], ["transfer", "Transfers"], ["move", "Deposits & withdrawals"]];
      var list = Store.transactions.list().filter(function(t){
        if(Util.monthOf(t.date) !== state.month) return false;
        var f = state.txFilter;
        return f === "all" || t.type === f || (f === "move" && (t.type === "deposit" || t.type === "withdrawal"));
      }).sort(function(a, b){ return a.date === b.date ? (a.createdAt < b.createdAt ? 1 : -1) : (a.date < b.date ? 1 : -1); });

        return '<button class="filter' + (state.txFilter === f[0] ? " active" : "") + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
      }).join("") + '</div>';
      if(!list.length){
        html += '<div class="card">';
        html += '<div class="empty"><div class="big t-sky">' + Icons.svg("list") + '</div>No ' + (state.txFilter === "all" ? "" : "matching ") + 'transactions in ' + Util.monthLabel(state.month) + '.</div>';
      } else {
        // group by date; daily income / expense totals (display only)
        var days = [], byDay = {};
        list.forEach(function(t){ if(!byDay[t.date]){ byDay[t.date] = []; days.push(t.date); } byDay[t.date].push(t); });
        days.forEach(function(d){

          byDay[d].forEach(function(t){ if(t.type === "income") inc += t.amount; else if(t.type === "expense") exp += t.amount; });
          html += '<section class="tx-day"><div class="tx-day-head"><span class="d">' + Util.fmtDate(d) + '</span><span class="tot">' +

            '</span></div><div class="card">' + byDay[d].map(txRow).join("") + '</div></section>';
        });
        html += '<div>';
      }
      html += '<button class="add-btn" data-act="add-tx">' + Icons.svg("plus") + 'Add transaction</button></div>';   // closes the empty-state card or the wrapper div

    /* receipt widget used by transaction + bill forms.
       Keeps changes in memory until the form is saved. */
    function receiptWidget(root, existingId){
      var st = { existingId: existingId || null, newFile: null, removed: false, previewUrl: null };
      var area = root.querySelector(".receipt-area");
      function draw(){
        if(st.previewUrl){ URL.revokeObjectURL(st.previewUrl); st.previewUrl = null; }
        var has = st.newFile || (st.existingId && !st.removed);
        area.innerHTML = has
          ? '<img class="thumb" alt="Receipt preview"><span class="r-text">Receipt attached</span>' +
            '<button type="button" class="link-btn" data-r="view">View</button>' +
            '<label class="link-btn" style="position:relative;overflow:hidden;cursor:pointer;">Replace<input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;font-size:16px;"></label>' +
            '<button type="button" class="link-btn red" data-r="remove">Remove</button>'
          : '<span class="r-text">No receipt</span><label class="pick">' + Icons.svg("camera") + 'Add receipt<input type="file" accept="image/*" aria-label="Take photo or choose receipt image"></label>';
        if(has){
          var img = area.querySelector(".thumb");
          var p = st.newFile ? Promise.resolve(URL.createObjectURL(st.newFile)) : Receipts.getUrl(st.existingId);
          p.then(function(u){ if(u){ st.previewUrl = u; img.src = u; } else { img.alt = "Missing"; } }).catch(function(){});
          img.addEventListener("click", view);
          area.querySelector('[data-r="view"]').addEventListener("click", view);
          area.querySelector('[data-r="remove"]').addEventListener("click", function(){ st.newFile = null; st.removed = true; draw(); });
        }
        var input = area.querySelector('input[type=file]');
        input.addEventListener("change", function(){
          var f = input.files && input.files[0];
          var err = Receipts.validate(f);
          if(err){ toast(err, true); return; }
          st.newFile = f; st.removed = false; draw();
        });
      }
      function view(){
        if(!st.previewUrl) return;
        var w = window.open("", "_blank");
        if(w){ w.document.write('<title>Receipt</title><body style="margin:0;background:#111;display:flex;justify-content:center"><img src="' + st.previewUrl + '" style="max-width:100%;height:auto">'); }
        else toast("Allow pop-ups to view the full receipt.", true);
      }
      draw();
      return {
        // returns the receiptId to store on the record after saving
        commit: function(){
          var oldId = st.existingId;
          if(st.newFile){
            return Receipts.save(st.newFile).then(function(id){ if(oldId) Receipts.remove(oldId).catch(function(){}); return id; });
          }
          if(st.removed && oldId) return Receipts.remove(oldId).then(function(){ return null; }, function(){ return null; });
          return Promise.resolve(oldId);
        },
        dispose: function(){ if(st.previewUrl) URL.revokeObjectURL(st.previewUrl); }
      };
    }

            '<button type="button" class="btn secondary" data-cancel>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
        '</form>',
        function(root){
          var fType = $("fType"), fCat = $("fCat"), fBill = $("fBill");
          widget = receiptWidget(root, t.receiptId);
          root.querySelector("[data-cancel]").addEventListener("click", closeSheet);
          function syncType(){
            var ty = fType.value;
            root.querySelector('[data-field="type"]').className = "field type-" + ty;
            $("fToWrap").style.display = ty === "transfer" ? "" : "none";
            $("fAccLabel").textContent = ty === "transfer" ? "From account" : "Account";
            $("fCatWrap").style.display = (ty === "income" || ty === "expense") ? "" : "none";
            var cats = ty === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
            var cur = fCat.value || t.category;
            fCat.innerHTML = '<option value="">—</option>' + opts(cats, cur);
            $("fBillWrap").style.display = ty === "expense" ? "" : "none";
            if(ty === "expense") fillBills();
          }
          function fillBills(){
            var cur = fBill.value || t.billId || "";
            var m = Util.monthOf($("fDate").value) || state.month;
            var bills = Store.bills.list().filter(function(b){
              return b.id === cur || Ledger.billStatus(b).remaining > 0 && Math.abs(monthsBetween(Util.monthOf(b.dueDate), m)) <= 2;
            }).sort(function(a, b){ return a.dueDate < b.dueDate ? -1 : 1; });
            fBill.innerHTML = '<option value="">Not a planned bill</option>' + bills.map(function(b){
              var st = Ledger.billStatus(b);
              var remainingExcludingThis = st.remaining + (isEdit && b.id === t.billId ? Math.min(Store.transactions.get(t.id).amount, b.amount) : 0);
              return '<option value="' + b.id + '"' + (b.id === cur ? " selected" : "") + '>' + Util.esc(b.name) + ' — ' + Util.money(Math.min(remainingExcludingThis, b.amount)) + ' due ' + Util.fmtDate(b.dueDate) + '</option>';
            }).join("");
            billHint();
          }
          function billHint(){
            var b = Store.bills.get(fBill.value);
            var hint = $("fBillHint");
            if(!b){ hint.textContent = ""; return; }
            var st = Ledger.billStatus(b);
            var others = st.paid - (isEdit && t.billId === b.id ? Store.transactions.get(t.id).amount : 0);
            var amt = Util.parseAmount($("fAmount").value) || 0;
            var after = Util.r2(others + amt);
            hint.textContent = after > b.amount
              ? "⚠️ This makes " + Util.money(after) + " paid on a " + Util.money(b.amount) + " bill (" + Util.money(after - b.amount) + " over). The account is still charged the real amount."
              : "Bill: " + Util.money(b.amount) + " · after this payment " + Util.money(after) + " paid, " + Util.money(b.amount - after) + " left.";
            hint.style.color = after > b.amount ? "#b45309" : "";
          }
          fType.addEventListener("change", syncType);
          $("fDate").addEventListener("change", function(){ if(fType.value === "expense") fillBills(); });
          fBill.addEventListener("change", function(){
            var b = Store.bills.get(fBill.value);
            if(b){
              if(!$("fDesc").value) $("fDesc").value = b.name;
              if(!$("fAmount").value){ $("fAmount").value = Ledger.billStatus(b).remaining.toFixed(2); }
              fCat.value = b.category;
              if(b.accountId && Store.accounts.get(b.accountId) && !Store.accounts.get(b.accountId).archived) $("fAcc").value = b.accountId;
            }
            billHint();
          });
          $("fAmount").addEventListener("input", billHint);
          syncType();

          if(isEdit) $("fDelete").addEventListener("click", function(){ closeSheet(); deleteTx(t.id); });

          $("txForm").addEventListener("submit", function(e){
            e.preventDefault();
            var ty = fType.value, ok = true;
            var amt = Util.parseAmount($("fAmount").value);
            fieldErr(root, "amount", amt === null ? "Enter an amount above 0 (max 2 decimals)." : ""); ok = ok && amt !== null;
            var acc = $("fAcc").value;
            fieldErr(root, "account", acc ? "" : "Choose an account."); ok = ok && !!acc;
            var to = ty === "transfer" ? $("fTo").value : null;
            if(ty === "transfer"){
              var toErr = !to ? "Choose where the money goes." : (to === acc ? "From and to must be different accounts." : "");
              fieldErr(root, "to", toErr); ok = ok && !toErr;
            }
            var date = $("fDate").value;
            fieldErr(root, "date", Util.isISODate(date) ? "" : "Choose a valid date."); ok = ok && Util.isISODate(date);
            var desc = $("fDesc").value.trim();
            if(!ok){ toast("Please fix the highlighted fields.", true); return; }
            var btn = root.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = "Saving…";
            widget.commit().then(function(receiptId){
              var rec = {
                id: t.id, type: ty, amount: amt, date: date, accountId: acc, toAccountId: to,
                description: desc, category: (ty === "income" || ty === "expense") ? fCat.value : "",
                billId: ty === "expense" ? (fBill.value || null) : null,
                receiptId: receiptId, note: $("fNote").value.trim(), createdAt: t.createdAt
              };
              Store.transactions.save(rec);
              closeSheet();
              toast(isEdit ? "Transaction updated" : "Transaction added");
              if(Util.monthOf(date) !== state.month){ state.month = Util.monthOf(date); }
              render();
            }).catch(function(err){
              btn.disabled = false; btn.textContent = "Save";
              toast("Receipt couldn't be saved: " + (err && err.message || err), true);
            });
          });
        },
        function(){ if(widget) widget.dispose(); }
      );
    }
    function monthsBetween(a, b){ return (+a.slice(0, 4) - +b.slice(0, 4)) * 12 + (+a.slice(5, 7) - +b.slice(5, 7)); }
    function defaultDate(){ return state.month === Util.currentMonth() ? Util.todayISO() : state.month + "-01"; }

    function deleteTx(id){
      var t = Store.transactions.get(id); if(!t) return;
      var b = t.billId ? Store.bills.get(t.billId) : null;
      confirmSheet({
        title: "Delete this transaction?",
        message: TX_TYPES[t.type].t + " of " + Util.money(t.amount) + " on " + Util.fmtDate(t.date) + " will be removed and the account balance restored." +
          (b ? "\n\nIt is a payment for “" + b.name + "”, so that bill will go back to unpaid by " + Util.money(Math.min(t.amount, b.amount)) + "." : "") +
          (t.receiptId ? "\n\nIts receipt image will also be deleted." : ""),
        confirmText: "Delete",
        onConfirm: function(){
          var r = Store.transactions.remove(id);
          if(r && r.receiptId) Receipts.remove(r.receiptId).catch(function(){});
          toast("Transaction deleted");
          render();
        }
      });
    }

    /* ---------- Bill form + detail ---------- */

    function payBill(id){
      var b = Store.bills.get(id); if(!b) return;
      var st = Ledger.billStatus(b);
      openTxForm(null, {
        type: "expense", amount: st.remaining > 0 ? st.remaining : "", description: b.name, category: b.category, billId: b.id,
        accountId: (b.accountId && Store.accounts.get(b.accountId) && !Store.accounts.get(b.accountId).archived) ? b.accountId : (Store.accounts.list(false)[0] || {}).id,
        date: Util.todayISO()
      });
    }

    function deleteBill(id){
      var b = Store.bills.get(id); if(!b) return;
      var pays = Store.transactions.forBill(id);
      function cleanup(res){
        if(res.bill && res.bill.receiptId) Receipts.remove(res.bill.receiptId).catch(function(){});
        res.removedTx.forEach(function(t){ if(t.receiptId) Receipts.remove(t.receiptId).catch(function(){}); });
        toast("Bill deleted"); render();
      }
      if(!pays.length){
        confirmSheet({ title: "Delete “" + b.name + "”?", message: "This bill has no payments, so only the bill is removed. No balances change.", onConfirm: function(){ cleanup(Store.bills.remove(id, true)); } });
        return;
      }
      var total = pays.reduce(function(s, t){ return s + t.amount; }, 0);
      confirmSheet({
        title: "Delete “" + b.name + "”?",
        message: "It has " + pays.length + " linked payment(s) totalling " + Util.money(total) + ".\n\nKeep the payment as a normal expense (balances stay the same), or delete the payment too (" + Util.money(total) + " goes back to the account).",
        altText: "Delete bill, keep payment as expense",
        onAlt: function(){ cleanup(Store.bills.remove(id, true)); },
        confirmText: "Delete bill and payment",
        onConfirm: function(){ cleanup(Store.bills.remove(id, false)); }
      });
    }

    function copyBillsFromPrevious(){
      var prev = Util.addMonths(state.month, -1);
      var src = Store.bills.list().filter(function(b){ return Util.monthOf(b.dueDate) === prev; });
      src.forEach(function(b){
        var day = Math.min(+b.dueDate.slice(8, 10), +Util.endOfMonth(state.month).slice(8, 10));
        Store.bills.save({ id: Util.uid("bill_"), name: b.name, amount: b.amount, dueDate: state.month + "-" + Util.pad(day), category: b.category,
          accountId: b.accountId, receiptId: null, note: b.note, createdAt: new Date().toISOString() });
      });
      toast(src.length + " bill(s) copied as unpaid");
      render();
    }

      openSheet(
        '<div class="sheet-head"><h3>' + (isEdit ? "Edit account" : "Create account") + '</h3><button class="sheet-close" data-close aria-label="Close">✕</button></div>' +

          '<div class="field" data-field="name"><label for="aName">Account name</label><input id="aName" maxlength="60" placeholder="e.g. Main bank" value="' + Util.esc(a.name) + '"><div class="err"></div></div>' +
          '<div class="frow wrap-xs">' +
            '<div class="field"><label for="aType">Type</label><select id="aType">' + ACCOUNT_TYPES.map(function(t){ return '<option value="' + t.v + '"' + (t.v === a.type ? " selected" : "") + '>' + t.t + '</option>'; }).join("") + '</select></div>' +

          '</div>' +

          '<p class="muted" style="margin:0 0 10px;">Turn off for savings or investments you don’t want to spend.</p>' +

          '<div class="sheet-actions">' + (isEdit ? '<button type="button" class="btn del" id="aDelete">Delete</button>' : '') +

        function(root){

            if(usage.tx > 0){
              confirmSheet({ title: "Can’t delete “" + a.name + "”", message: "It has " + usage.tx + " transaction(s), and deleting it would change your history.\n\nArchive it instead — it stays in your records but is hidden from forms.",
                confirmText: "Archive account", danger: false,

              return;
            }
            confirmSheet({ title: "Delete “" + a.name + "”?", message: "The account will be removed." + (usage.bills ? " " + usage.bills + " bill(s) will no longer have a default account." : ""),

          });
          $("accForm").addEventListener("submit", function(e){
            e.preventDefault();
            var name = $("aName").value.trim();
            var open = Util.parseSignedAmount($("aOpen").value);

            fieldErr(root, "name", !name ? "Give the account a name." : (dup ? "You already have an account with this name." : ""));
            fieldErr(root, "opening", open === null ? "Enter a number like 500 or 500.00 (negative allowed for credit cards)." : "");
            if(!name || dup || open === null){ toast("Please fix the highlighted fields.", true); return; }
            Store.accounts.save({ id: a.id, name: name, type: typeSel.value, openingBalance: open, includeInAvailable: $("aAvail").checked,

    /* ---------- Export / backup ---------- */
    function download(blob, name){
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
    }
    function exportXlsx(month){
      Receipts.ids().catch(function(){ return []; }).then(function(ids){
        try{
          var have = {}; ids.forEach(function(i){ have[i] = true; });
          var H = function(t){ return { v: t, s: 1 }; }, M = function(v){ return { v: Util.r2(v), s: 2 }; }, MB = function(v){ return { v: Util.r2(v), s: 3 }; }, B = function(t){ return { v: t, s: 4 }; };
          var inScope = function(d){ return !month || Util.monthOf(d) === month; };
          var txs = Store.transactions.list().filter(function(t){ return inScope(t.date); }).sort(function(a, b){ return a.date < b.date ? -1 : 1; });
          var bills = Store.bills.list().filter(function(b){ return inScope(b.dueDate); }).sort(function(a, b){ return a.dueDate < b.dueDate ? -1 : 1; });
          var sheets = [];
          // Summary: one block per month in scope
          var months = month ? [month] : Array.from(new Set(Store.transactions.list().map(function(t){ return Util.monthOf(t.date); })
            .concat(Store.bills.list().map(function(b){ return Util.monthOf(b.dueDate); })))).sort();
          var S = [[H("Month"), H("Income"), H("Expenses (actual)"), H("Bill payments"), H("Other spending"), H("Net cash flow"), H("Planned bills"), H("Still to pay"), H("Transfers"), H("Into savings"), H("Deposits"), H("Withdrawals"), H("Total balance (month end)"), H("Remaining available")]];
          months.forEach(function(m){
            var s = Ledger.monthSummary(m);
            S.push([Util.monthLabel(m), M(s.income), M(s.expenses), M(s.billPayments), M(s.otherSpending), M(s.netFlow), M(s.planned), M(s.pending), M(s.transfers), M(s.toSavings), M(s.deposits), M(s.withdrawals), MB(s.totalBalance), MB(s.remainingAvailable)]);
          });
          S.push([]); S.push([B("Exported"), new Date().toLocaleString("en-MY")]);
          S.push(["Transfers, deposits and withdrawals are not counted as income or expenses."]);
          sheets.push({ name: "Monthly Summary", rows: S, widths: [16, 13, 16, 14, 14, 14, 14, 13, 12, 13, 12, 13, 22, 20], freezeHeader: true });

          var I = [[H("Date"), H("Description"), H("Category"), H("Account"), H("Amount (RM)"), H("Receipt"), H("Note"), H("Transaction ID")]];
          txs.filter(function(t){ return t.type === "income"; }).forEach(function(t){
            I.push([t.date, t.description, t.category, accName(t.accountId), M(t.amount), t.receiptId && have[t.receiptId] ? "Yes (" + t.receiptId + ")" : "No", t.note, t.id]);
          });
          sheets.push({ name: "Income", rows: I, widths: [12, 28, 14, 18, 13, 30, 24, 30], freezeHeader: true });

          var E = [[H("Due date"), H("Bill / planned expense"), H("Category"), H("Pay from"), H("Planned (RM)"), H("Paid (RM)"), H("Left (RM)"), H("Status"), H("Linked payment IDs"), H("Receipt"), H("Bill ID")]];
          bills.forEach(function(b){
            var st = Ledger.billStatus(b);
            E.push([b.dueDate, b.name, b.category, b.accountId ? accName(b.accountId) : "", M(b.amount), M(st.paid), M(st.remaining),
              st.status === "paid" ? (st.over > 0 ? "Paid (+" + Util.money(st.over) + " over)" : "Paid") : (st.overdue ? "Overdue" : (st.status === "partial" ? "Partly paid" : "Pending")),
              st.payments.map(function(p){ return p.id + " (" + p.date + ", " + Util.money(p.amount) + ")"; }).join("; "),
              b.receiptId && have[b.receiptId] ? "Yes (" + b.receiptId + ")" : "No", b.id]);
          });
          var X = [[H("Date"), H("Description"), H("Category"), H("Account"), H("Amount (RM)"), H("Linked bill"), H("Linked bill ID"), H("Receipt"), H("Note"), H("Transaction ID")]];
          txs.filter(function(t){ return t.type === "expense"; }).forEach(function(t){
            var b = t.billId ? Store.bills.get(t.billId) : null;
            X.push([t.date, t.description, t.category, accName(t.accountId), M(t.amount), b ? b.name : "", t.billId || "", t.receiptId && have[t.receiptId] ? "Yes (" + t.receiptId + ")" : "No", t.note, t.id]);
          });
          sheets.push({ name: "Expenses (actual)", rows: X, widths: [12, 28, 16, 18, 13, 22, 30, 30, 24, 30], freezeHeader: true });
          sheets.push({ name: "Bills (planned)", rows: E, widths: [12, 28, 16, 18, 13, 12, 12, 22, 50, 30, 30], freezeHeader: true });

          var MV = [[H("Date"), H("Type"), H("Description"), H("From / account"), H("To account"), H("Amount (RM)"), H("Receipt"), H("Note"), H("Transaction ID")]];
          txs.filter(function(t){ return t.type === "transfer" || t.type === "deposit" || t.type === "withdrawal"; }).forEach(function(t){
            MV.push([t.date, TX_TYPES[t.type].t, t.description, accName(t.accountId), t.toAccountId ? accName(t.toAccountId) : "", M(t.amount), t.receiptId && have[t.receiptId] ? "Yes (" + t.receiptId + ")" : "No", t.note, t.id]);
          });
          sheets.push({ name: "Account Movements", rows: MV, widths: [12, 12, 26, 18, 18, 13, 30, 24, 30], freezeHeader: true });

          var endDate = month ? Util.endOfMonth(month) : null;
          var A = [[H("Account"), H("Type"), H("Opening (RM)"), H(endDate ? "Balance at " + endDate : "Current balance"), H("In available?"), H("Archived"), H("Account ID")]];
          Store.accounts.list(true).forEach(function(a){
            A.push([a.name, accountType(a.type).t, M(a.openingBalance), MB(Ledger.balance(a.id, endDate)), a.includeInAvailable ? "Yes" : "No", a.archived ? "Yes" : "No", a.id]);
          });
          sheets.push({ name: "Accounts", rows: A, widths: [22, 14, 14, 22, 13, 10, 30], freezeHeader: true });

          download(Xlsx.build(sheets), "Money_Tracker_" + activeSlug() + "_" + (month || "all_records_" + Util.todayISO()) + ".xlsx");
          toast("Excel downloaded");
        }catch(err){ console.error(err); toast("Export failed: " + err.message, true); }
      });
    }
    // Backup = this profile's info + its financial data (receipts not included)
    function backup(){
      var p = Profiles.active();
      var payload = { app: "money-tracker-public", format: "profile-backup", version: 3, ownerId: p.id, exportedAt: new Date().toISOString(),
                      profile: { name: p.name, avatar: p.avatar }, data: Store.snapshot() };
      download(new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" }), "money-tracker-backup_" + activeSlug() + "_" + Util.todayISO() + ".json");
      toast("Backup downloaded");
    }
    function restore(file){
      if(!file) return;
      var fr = new FileReader();
      fr.onload = function(){
        var d;
        try{ d = JSON.parse(fr.result); }catch(e){ toast("That file isn’t a valid backup.", true); return; }
        var data = (d && d.format === "profile-backup") ? d.data : d;   // older backups had the data at top level
        if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)){ toast("That file isn’t a Money Tracker backup.", true); return; }
        var p = Profiles.active();
        var backupOwner = (d && typeof d.ownerId === "string") ? d.ownerId : ((data && typeof data.ownerId === "string") ? data.ownerId : null);
        if(backupOwner && backupOwner !== p.id){
          toast("This backup belongs to a different profile. You can only restore your own data.", true);
          return;
        }
        var from = !backupOwner ? "This backup isn’t linked to any profile. Restoring it assigns these records to you." : null;
        confirmSheet({
          title: "Restore into “" + p.name + "”?",
          message: "This replaces ALL of " + p.name + "’s accounts, transactions and bills with the backup (" + data.accounts.length + " accounts, " +
            data.transactions.length + " transactions, " + (data.bills || []).length + " bills)." + (from ? "\n\n" + from : "") +
            "\n\nOnly your profile changes. Your name and photo stay as they are.\n\nTip: download a backup first.",
          confirmText: "Replace this profile’s data",
          onConfirm: function(){ Store.replaceAll(data); toast("Backup restored into " + p.name); render(); }
        });
      };
      fr.readAsText(file);
    }
