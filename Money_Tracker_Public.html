    /* ---------- Bill checkbox: tick = record payment, untick = reverse ----------
       The bill itself never moves money. Ticking creates ONE expense transaction
       (linked by billId) for the amount still owed, from the bill's account.
       Before writing, the status is re-read, so repeated taps can't create a
       second payment. Unticking deletes the linked payment(s) after confirmation. */
    var billBusy = {};
    function toggleBill(id){
      var b = Store.bills.get(id);
      if(!b || billBusy[id]) return;
      var st = Ledger.billStatus(b);
      if(st.status === "pending"){ payBillNow(b); return; }
      if(st.status === "partial"){
        confirmSheet({
          title: "“" + b.name + "” is partly paid",
          message: Util.money(st.paid) + " of " + Util.money(b.amount) + " has been paid. What would you like to do?",
          confirmText: "Pay remaining " + Util.money(st.remaining), danger: false,
          onConfirm: function(){ payBillNow(b); },
          altText: "Undo the " + Util.money(st.paid) + " paid",
          onAlt: function(){ reverseBillPayments(b); }
        });
        return;
      }
      reverseBillPayments(b);
    }
    function payBillNow(b){
      var acc = b.accountId ? Store.accounts.get(b.accountId) : null;
      if(!acc || acc.archived){
        toast("Choose which account paid this bill.");
        payBill(b.id); // opens the payment form with everything else prefilled
        return;
      }
      billBusy[b.id] = true;
      try{
        var fresh = Ledger.billStatus(Store.bills.get(b.id) || b);
        if(fresh.remaining <= 0) return;           // already paid — never add a duplicate
        Store.transactions.save({
          id: Util.uid("tx_"), type: "expense", amount: fresh.remaining, date: Util.todayISO(),
          accountId: acc.id, toAccountId: null, description: b.name, category: b.category,
          billId: b.id, receiptId: null, note: "", createdAt: new Date().toISOString()
        });
        toast("Paid " + Util.money(fresh.remaining) + " from " + acc.name);
      } finally {
        billBusy[b.id] = false;
        render();
      }
    }
    function reverseBillPayments(b){
      var pays = Store.transactions.forBill(b.id);
      if(!pays.length){ render(); return; }
      var total = pays.reduce(function(s, t){ return s + t.amount; }, 0);
      var withReceipts = pays.filter(function(t){ return t.receiptId; }).length;
      confirmSheet({
        title: "Mark “" + b.name + "” as unpaid?",
        message: (pays.length === 1
            ? "The payment of " + Util.money(total) + " from " + accName(pays[0].accountId) + " (" + Util.fmtDate(pays[0].date) + ") will be removed"
            : pays.length + " linked payments totalling " + Util.money(total) + " will be removed") +
          " and the money goes back to the account balance. The bill stays reserved." +
          (withReceipts ? "\n\n" + withReceipts + " attached receipt image(s) will also be deleted." : ""),
        confirmText: "Mark as unpaid",
        onConfirm: function(){
          billBusy[b.id] = true;
          try{
            Store.transactions.forBill(b.id).forEach(function(t){
              Store.transactions.remove(t.id);
              if(t.receiptId) Receipts.remove(t.receiptId).catch(function(){});
            });
            toast("“" + b.name + "” marked as unpaid");
          } finally { billBusy[b.id] = false; render(); }
        }
      });
    }

    /* ---------- Local profiles (UI) — LOCAL PROTOTYPE MODE ----------
       Sign-in here only selects a namespace in THIS browser. It is not
       authentication: there are no passwords, nothing is verified by a server,
       and anyone with access to this browser profile can open any local profile
       by name or read localStorage directly. Real accounts need the backend
       described in supabase_schema.sql (Supabase Auth + Row Level Security).
       Session rules kept here: no list of other profiles while signed in, sign
       out wipes the active user's data from memory and the screen, and every
       read/write/export/restore/receipt call goes through the active profile. */
    function initials(name){
      return String(name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(function(w){ return w.charAt(0).toUpperCase(); }).join("") || "?";
    }
    function avatarHtml(p, cls){

                      : '<span class="' + cls + ' initials">' + Util.esc(initials(p.name)) + '</span>';
    }
    function slug(name){
      var s = String(name || "").normalize ? String(name).normalize("NFKD").replace(/[̀-ͯ]/g, "") : String(name || "");
      s = s.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30);
      return s || "Profile";
    }
    function activeSlug(){ var p = Profiles.active(); return slug(p ? p.name : ""); }
    var LOCAL_NOTICE = "Local prototype: profiles keep data separate in this browser, but they are not secure. There are no passwords, and anyone using this browser can open a profile by name.";

    // square-crop + shrink to 160px JPEG so it fits comfortably in localStorage
    function resizeAvatar(file){
      return new Promise(function(res, rej){
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function(){
          try{
            var side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
            c.width = c.height = 160;
            var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 160, 160);
            ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 160, 160);
            URL.revokeObjectURL(url);
            res(c.toDataURL("image/jpeg", 0.85));
          }catch(e){ URL.revokeObjectURL(url); rej(e); }
        };
        img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("This image format can’t be read. Try a JPG or PNG.")); };
        img.src = url;
      });
    }

    // mode "create" (only while signed out) or "edit" (own profile only)
    function openProfileForm(mode){
      var isEdit = mode === "edit";
      if(isEdit && !Profiles.active()) return;
      if(!isEdit && Profiles.active()) return;   // no creating other users while signed in
      var existing = isEdit ? Profiles.active() : null;
      var legacy = isEdit ? null : legacyOffer();
      var draft = { avatar: existing ? existing.avatar : null };
      openSheet(
        '<div class="sheet-head"><h3>' + (isEdit ? "Edit Profile" : "Create local profile") + '</h3><button class="sheet-close" data-close aria-label="Close">✕</button></div>' +
        '<form id="profileForm" novalidate>' +
          '<div class="avatar-edit"><span id="pAvatar"></span>' +
            '<div class="btn-row" style="flex:1;"><label class="pick">' + Icons.svg("camera") + 'Choose photo<input type="file" accept="image/*" id="pPhoto" aria-label="Choose profile photo"></label>' +
            '<button type="button" class="link-btn red" id="pRemovePhoto">Remove photo</button></div></div>' +
          '<div class="field" data-field="name"><label for="pName">Display name</label><input id="pName" maxlength="40" autocomplete="nickname" placeholder="e.g. Aisyah" value="' + Util.esc(existing ? existing.name : "") + '"><div class="err"></div></div>' +
          (legacy ? '<label class="check-row"><input type="checkbox" id="pMigrate"><span><b>Import earlier data into this profile</b><small>' + legacy.counts +
            ' saved in this browser before profiles. Only tick this if the data is yours. A copy is made; the original stays.</small></span></label>' : '') +
          (isEdit ? '' : '<div class="info">' + LOCAL_NOTICE + '</div>') +
          '<div class="sheet-actions">' + (isEdit ? '<button type="button" class="btn del" id="pDelete">Delete</button>' : '') +
            '<button type="button" class="btn secondary" data-cancel>Cancel</button><button type="submit" class="btn primary">Save Profile</button></div>' +
        '</form>',
        function(root){
          function drawAvatar(){
            $("pAvatar").innerHTML = avatarHtml({ name: $("pName").value.trim() || "?", avatar: draft.avatar }, "av-lg");
            $("pRemovePhoto").style.display = draft.avatar ? "" : "none";
          }
          drawAvatar();
          $("pName").addEventListener("input", drawAvatar);
          root.querySelector("[data-cancel]").addEventListener("click", closeSheet);
          $("pPhoto").addEventListener("change", function(e){
            var f = e.target.files && e.target.files[0];
            var err = Receipts.validate(f);
            if(err){ toast(err, true); return; }
            resizeAvatar(f).then(function(d){ draft.avatar = d; drawAvatar(); }).catch(function(er){ toast(er.message, true); });
          });
          $("pRemovePhoto").addEventListener("click", function(){ draft.avatar = null; drawAvatar(); });
          if(isEdit) $("pDelete").addEventListener("click", function(){
            confirmSheet({
              title: "Delete your profile “" + existing.name + "”?",
              message: "This permanently deletes your profile and all of its accounts, transactions, bills and receipt images from this browser, then signs you out.\n\nDownload a backup first if you might need this data.",
              confirmText: "Delete profile",
              onConfirm: function(){ deleteOwnProfile(existing.id); }
            });
          });
          $("profileForm").addEventListener("submit", function(e){
            e.preventDefault();
            var name = $("pName").value.trim();
            var err = !name ? "Enter a display name." : (Profiles.nameTaken(name, existing && existing.id) ? "That name is already used by a profile in this browser." : "");
            fieldErr(root, "name", err);

              if(migrate){
                Store.writeFor(p.id, legacy.data);     // copy, stamped with the new owner; original untouched

                  .catch(function(){ toast("Receipt images couldn’t be imported; your records were.", true); });

    /* ---------- event delegation ---------- */

      if(!el) return;

      var inSheet = !!el.closest("#sheet");
      var actions = {
        "add-tx": function(){ openTxForm(); },
        "add-transfer": function(){ openTxForm(null, { type: "transfer" }); },
        "edit-tx": function(){ openTxForm(id); },
        "del-tx": function(){ deleteTx(id); },

        "create-profile": function(){ openProfileForm("create"); },
        "account-menu": openAccountMenu,
        "sign-out": function(){ signOut(); },
        "import-legacy": importLegacy,

        "export-all": function(){ exportXlsx(null); },
        "backup": backup,
        "demo": loadDemo,
        "reset": resetAll
      };
      if(actions[act]){
        if(inSheet && /^(edit-tx|del-tx|pay-bill|del-bill|toggle-bill)$/.test(act)) closeSheet();
        actions[act]();
      }
    }

    function init(){

      document.addEventListener("click", onClick);
      document.addEventListener("submit", function(e){ if(e.target.id === "signInForm"){ e.preventDefault(); signIn(e.target); } });
      document.addEventListener("change", function(e){ if(e.target.id === "restoreInput"){ restore(e.target.files[0]); e.target.value = ""; } });
      document.querySelectorAll(".nav-btn[data-view]").forEach(function(b){ b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); }); });
      $("navAdd").addEventListener("click", function(){ openTxForm(); });
      $("prevMonth").addEventListener("click", function(){ setMonth(Util.addMonths(state.month, -1)); });
      $("nextMonth").addEventListener("click", function(){ setMonth(Util.addMonths(state.month, 1)); });
      $("monthLabel").addEventListener("click", function(){ setMonth(Util.currentMonth()); });
      $("overlay").addEventListener("click", function(e){ if(e.target === $("overlay")) closeSheet(); });
      document.addEventListener("keydown", function(e){ if(e.key === "Escape" && $("overlay").classList.contains("show")) closeSheet(); });
      // "More" lives behind the settings tools (keeps 5-slot nav); also reachable from Accounts
      setView("dashboard");
    }

    return { init: init, toast: toast, setView: setView, state: state };
  })();

  // exposed for automated tests only
  window.__mt = { Store: Store, Ledger: Ledger, Util: Util, UI: UI, Receipts: Receipts, Profiles: Profiles };
  document.addEventListener("DOMContentLoaded", UI.init);
})();
</script>
</body>
</html>
